    body {

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 22px;
    }
    .card {
      background: #14151F;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.2s;
    }
    .card:hover {
      border-color: #22D3EE;
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(34,211,238,0.2);
    }
    .badge {
      font-size: 11px;
      font-weight: 800;
      color: #22D3EE;
      background: rgba(34,211,238,0.1);
      padding: 2px 8px;
      border-radius: 8px;
      border: 1px solid rgba(34,211,238,0.2);
      margin-bottom: 10px;
      align-self: flex-start;
    }
    .badge-box {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 24px;
      background: #12131C;
      border: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .title { font-weight: bold; font-size: 14px; color: #fff; text-align: center; }
    .sub { font-size: 12px; color: #9CA3AF; margin-top: 4px; text-align: center; line-height: 1.4; }
  </style>
</head>

        <div class="title">${item.title}</div>
        <div class="sub">${item.desc}</div>
      `;
      gateGrid.appendChild(card);
    });
  </script>
</body>
</html>
